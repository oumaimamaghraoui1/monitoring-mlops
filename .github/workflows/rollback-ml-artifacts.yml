name: Rollback ML Artifacts Only

on:
  workflow_dispatch:
    inputs:
      source_run_number:
        description: "Run number of the artifact to restore, for example 18"
        required: true
      redeploy:
        description: "Redeploy backend to Cloud Foundry after restoring artifacts (true/false)"
        required: true
        default: "false"

concurrency:
  group: rollback-ml-artifacts
  cancel-in-progress: false

jobs:
  rollback-ml-artifacts:
    runs-on: ubuntu-latest
    environment: "biweekly-alm-refresh-cf secrets"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: monitoring-backend/package-lock.json

      - name: Validate rollback inputs
        run: |
          echo "Requested source run number: ${{ github.event.inputs.source_run_number }}"
          echo "Redeploy option: ${{ github.event.inputs.redeploy }}"

          case "${{ github.event.inputs.redeploy }}" in
            true|false)
              echo "Redeploy input is valid."
              ;;
            *)
              echo "Invalid redeploy input. Use true or false."
              exit 1
              ;;
          esac

      - name: Download artifact from selected run
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: biweekly-alm-refresh-cf.yml
          run_number: ${{ github.event.inputs.source_run_number }}
          name: mlops-artifacts-run-${{ github.event.inputs.source_run_number }}
          path: rollback-download
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect downloaded rollback artifact
        run: |
          echo "Downloaded rollback contents:"
          find rollback-download -type f | sort || true

      - name: Restore data snapshots
        working-directory: monitoring-backend
        run: |
          mkdir -p data

          cp -f ../rollback-download/data/all_config_logs.json data/ 2>/dev/null || true
          cp -f ../rollback-download/data/security_events.json data/ 2>/dev/null || true
          cp -f ../rollback-download/data/scored_snapshot.json data/ 2>/dev/null || true
          cp -f ../rollback-download/data/security_scored_snapshot.json data/ 2>/dev/null || true
          cp -f ../rollback-download/data/behaviour_baseline.json data/ 2>/dev/null || true
          cp -f ../rollback-download/data/role_alert_state.json data/ 2>/dev/null || true

          echo "Restored data files:"
          find data -maxdepth 1 -type f -print -exec ls -lh {} \; || true

          echo "Record counts after restore:"
          node -e "const fs=require('fs'); try { const a=JSON.parse(fs.readFileSync('data/all_config_logs.json','utf8')); console.log('all_config_logs:', Array.isArray(a)?a.length:'not array'); } catch(e){ console.log('all_config_logs: missing/unreadable'); }"
          node -e "const fs=require('fs'); try { const a=JSON.parse(fs.readFileSync('data/security_events.json','utf8')); console.log('security_events:', Array.isArray(a)?a.length:'not array'); } catch(e){ console.log('security_events: missing/unreadable'); }"

      - name: Restore ML feature and processed datasets
        working-directory: monitoring-backend
        run: |
          mkdir -p mlops/data/features
          mkdir -p mlops/data/processed

          cp -f ../rollback-download/mlops-data/features/ml_features.parquet mlops/data/features/ 2>/dev/null || true
          cp -f ../rollback-download/mlops-data/features/security_features.parquet mlops/data/features/ 2>/dev/null || true
          cp -f ../rollback-download/mlops-data/processed/ml_events.parquet mlops/data/processed/ 2>/dev/null || true

          echo "Restored ML feature/processed files:"
          find mlops/data -maxdepth 3 -type f -print -exec ls -lh {} \; || true

      - name: Restore risk model artifacts
        working-directory: monitoring-backend
        run: |
          mkdir -p mlops/models/anomaly

          RISK_MODEL=$(find ../rollback-download/models -type f -name "isolation_forest_run*.joblib" | head -n 1)
          RISK_SCALER=$(find ../rollback-download/models -type f -name "scaler_run*.joblib" | head -n 1)

          if [ -z "$RISK_MODEL" ]; then
            echo "No versioned isolation forest model found in rollback artifact."
            exit 1
          fi

          if [ -z "$RISK_SCALER" ]; then
            echo "No versioned scaler model found in rollback artifact."
            exit 1
          fi

          cp "$RISK_MODEL" mlops/models/anomaly/isolation_forest.joblib
          cp "$RISK_SCALER" mlops/models/anomaly/scaler.joblib

          echo "Restored risk model artifacts:"
          ls -lh mlops/models/anomaly/isolation_forest.joblib
          ls -lh mlops/models/anomaly/scaler.joblib

      - name: Restore security model artifacts
        working-directory: monitoring-backend
        run: |
          mkdir -p mlops/models/anomaly

          SECURITY_MODEL=$(find ../rollback-download/models -type f -name "security_if_run*.joblib" | head -n 1)
          SECURITY_SCALER=$(find ../rollback-download/models -type f -name "security_scaler_run*.joblib" | head -n 1)

          if [ -z "$SECURITY_MODEL" ]; then
            echo "No versioned security_if model found in rollback artifact."
            exit 1
          fi

          if [ -z "$SECURITY_SCALER" ]; then
            echo "No versioned security_scaler model found in rollback artifact."
            exit 1
          fi

          cp "$SECURITY_MODEL" mlops/models/anomaly/security_if.joblib
          cp "$SECURITY_SCALER" mlops/models/anomaly/security_scaler.joblib

          echo "Restored security model artifacts:"
          ls -lh mlops/models/anomaly/security_if.joblib
          ls -lh mlops/models/anomaly/security_scaler.joblib

      - name: Show rollback source manifest if available
        run: |
          if [ -f rollback-download/run-manifest.json ]; then
            echo "Rollback source manifest:"
            cat rollback-download/run-manifest.json
          else
            echo "No run-manifest.json found."
          fi

      - name: Install backend dependencies
        working-directory: monitoring-backend
        run: npm ci --ignore-scripts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare ML virtual environment
        working-directory: monitoring-backend
        run: |
          python -m venv mlops/venv
          mlops/venv/bin/pip install --upgrade pip
          mlops/venv/bin/pip install -r mlops/requirements.txt

      - name: Verify restored model files before rebuild
        working-directory: monitoring-backend
        run: |
          test -f mlops/models/anomaly/isolation_forest.joblib || (echo "Missing restored isolation_forest.joblib" && exit 1)
          test -f mlops/models/anomaly/scaler.joblib || (echo "Missing restored scaler.joblib" && exit 1)
          test -f mlops/models/anomaly/security_if.joblib || (echo "Missing restored security_if.joblib" && exit 1)
          test -f mlops/models/anomaly/security_scaler.joblib || (echo "Missing restored security_scaler.joblib" && exit 1)

          ls -lh mlops/models/anomaly/isolation_forest.joblib
          ls -lh mlops/models/anomaly/scaler.joblib
          ls -lh mlops/models/anomaly/security_if.joblib
          ls -lh mlops/models/anomaly/security_scaler.joblib

      - name: Rebuild normalized and feature datasets
        working-directory: monitoring-backend
        run: |
          echo "Rebuilding normalized and feature datasets..."
          mlops/venv/bin/python mlops/pipelines/01_normalize_logs.py
          mlops/venv/bin/python mlops/pipelines/02_build_features.py
          mlops/venv/bin/python mlops/security/02_build_security_features.py

          echo "Generated feature datasets:"
          find mlops/data -maxdepth 3 -type f -print -exec ls -lh {} \; || true

      - name: Rebuild risk scored outputs from restored model and data
        working-directory: monitoring-backend
        run: |
          echo "Rebuilding risk-scored outputs..."
          mlops/venv/bin/python mlops/inference/score_event.py

          echo "Searching risk-related generated files after rollback rebuild..."
          find . -maxdepth 6 -type f \( -iname "*score*" -o -iname "*scored*" -o -iname "*risk*" \) -print -exec ls -lh {} \; || true

      - name: Rebuild security scored outputs from restored data
        working-directory: monitoring-backend
        run: |
          echo "Rebuilding security-scored outputs..."
          mlops/venv/bin/python mlops/inference/security_score.py

          echo "Searching security-related generated files after rollback rebuild..."
          find . -maxdepth 6 -type f \( -iname "*security*" -o -iname "*ueba*" -o -iname "*score*" \) -print -exec ls -lh {} \; || true

      - name: Inspect rebuilt runtime files
        working-directory: monitoring-backend
        run: |
          echo "Inspecting important data/runtime files after rebuild..."
          find data -maxdepth 3 -type f -print -exec ls -lh {} \; || true
          find mlops -maxdepth 6 -type f \( -iname "*score*" -o -iname "*scored*" -o -iname "*risk*" -o -iname "*security*" -o -iname "*ueba*" \) -print -exec ls -lh {} \; || true

      - name: Install Cloud Foundry CLI
        if: github.event.inputs.redeploy == 'true'
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli
          cf version

      - name: Login to Cloud Foundry
        if: github.event.inputs.redeploy == 'true'
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api "$CF_API"
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      - name: Redeploy backend with restored ML artifacts
        if: github.event.inputs.redeploy == 'true'
        working-directory: monitoring-backend
        run: |
          cf push monitoring-backend -f manifest.yml
          cf app monitoring-backend

      - name: Smoke test backend after rollback
        if: github.event.inputs.redeploy == 'true'
        run: |
          curl -f "https://monitoring-backend.cfapps.eu10-004.hana.ondemand.com/health" || true

      - name: Smoke test risk scored endpoint after rollback
        if: github.event.inputs.redeploy == 'true'
        run: |
          echo "Checking /audit/scored after rollback deployment..."
          curl -f -sS "https://monitoring-backend.cfapps.eu10-004.hana.ondemand.com/audit/scored" \
            -o /tmp/audit-scored-rollback.json

          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/audit-scored-rollback.json','utf8')); console.log('audit scored logs after rollback:', Array.isArray(j.logs) ? j.logs.length : 'not array');"

      - name: Smoke test security endpoint after rollback
        if: github.event.inputs.redeploy == 'true'
        run: |
          echo "Checking security endpoint after rollback deployment..."
          curl -f -sS "https://monitoring-backend.cfapps.eu10-004.hana.ondemand.com/security/events" \
            -o /tmp/security-events-rollback.json || true

          node -e "const fs=require('fs'); try { const j=JSON.parse(fs.readFileSync('/tmp/security-events-rollback.json','utf8')); console.log('security endpoint payload keys:', Object.keys(j)); } catch(e) { console.log('security endpoint payload unreadable or endpoint unavailable'); }"