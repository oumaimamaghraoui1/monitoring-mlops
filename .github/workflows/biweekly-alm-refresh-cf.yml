name: Biweekly ALM Logs Refresh and Cloud Foundry Push

"on":
  workflow_dispatch:
  schedule:
    # PRODUCTION MODE:
    # Runs every Monday at 02:15 UTC.
    # The script below keeps only even ISO weeks,
    # so the effective execution is once every two weeks.
    - cron: "15 2 * * 1"

concurrency:
  group: biweekly-alm-refresh-cf
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment: "biweekly-alm-refresh-cf secrets"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run only every second ISO week
        id: biweekly
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_job=true" >> "$GITHUB_OUTPUT"
            echo "Manual run detected. Running job now."
            exit 0
          fi

          WEEK=$(date -u +%V)
          MOD=$((10#$WEEK % 2))

          echo "Current ISO week: $WEEK"
          echo "Modulo: $MOD"

          if [ "$MOD" -eq 0 ]; then
            echo "run_job=true" >> "$GITHUB_OUTPUT"
            echo "Execution week."
          else
            echo "run_job=false" >> "$GITHUB_OUTPUT"
            echo "Skipping this week because this is not the configured biweekly cycle."
          fi

      - name: Setup Node.js
        if: steps.biweekly.outputs.run_job == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        run: npm ci --ignore-scripts

      - name: Setup Python
        if: steps.biweekly.outputs.run_job == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare ML virtual environment expected by pollers
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        run: |
          python -m venv mlops/venv
          mlops/venv/bin/pip install --upgrade pip
          mlops/venv/bin/pip install -r mlops/requirements.txt

      - name: Validate ALM, Cloud Foundry and state secrets are available
        if: steps.biweekly.outputs.run_job == 'true'
        env:
          ALM_USERNAME: ${{ secrets.ALM_USERNAME }}
          ALM_PASSWORD: ${{ secrets.ALM_PASSWORD }}
          ALM_OAUTH_URL: ${{ secrets.ALM_OAUTH_URL }}
          ALM_API_URL: ${{ secrets.ALM_API_URL }}
          CF_API: ${{ secrets.CF_API }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          STATE_EXPORT_TOKEN: ${{ secrets.STATE_EXPORT_TOKEN }}
        run: |
          test -n "$ALM_USERNAME" || (echo "ALM_USERNAME is missing" && exit 1)
          test -n "$ALM_PASSWORD" || (echo "ALM_PASSWORD is missing" && exit 1)
          test -n "$ALM_OAUTH_URL" || (echo "ALM_OAUTH_URL is missing" && exit 1)
          test -n "$ALM_API_URL" || (echo "ALM_API_URL is missing" && exit 1)

          test -n "$CF_API" || (echo "CF_API is missing" && exit 1)
          test -n "$CF_ORG" || (echo "CF_ORG is missing" && exit 1)
          test -n "$CF_SPACE" || (echo "CF_SPACE is missing" && exit 1)
          test -n "$CF_USERNAME" || (echo "CF_USERNAME is missing" && exit 1)
          test -n "$CF_PASSWORD" || (echo "CF_PASSWORD is missing" && exit 1)

          test -n "$STATE_EXPORT_TOKEN" || (echo "STATE_EXPORT_TOKEN is missing" && exit 1)

          echo "All required secrets are available."
          echo "ALM_OAUTH_URL prefix:"
          echo "$ALM_OAUTH_URL" | cut -c1-8
          echo "ALM_API_URL prefix:"
          echo "$ALM_API_URL" | cut -c1-8
          echo "CF_API=$CF_API"
          echo "CF_SPACE=$CF_SPACE"
          echo "CF username is set."
          echo "State export token is set."

      - name: Seed full existing log state from deployed backend
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        env:
          STATE_EXPORT_TOKEN: ${{ secrets.STATE_EXPORT_TOKEN }}
        run: |
          mkdir -p data

          BACKEND_URL="https://monitoring-backend.cfapps.eu10-004.hana.ondemand.com"

          echo "Downloading full existing security events state..."
          curl -f -sS \
            -H "X-State-Token: $STATE_EXPORT_TOKEN" \
            "$BACKEND_URL/internal/state/security-events" \
            -o data/security_events.json

          echo "Downloading full existing config logs state..."
          curl -f -sS \
            -H "X-State-Token: $STATE_EXPORT_TOKEN" \
            "$BACKEND_URL/internal/state/config-logs" \
            -o data/all_config_logs.json

          echo "Seeded files:"
          ls -lh data/security_events.json || true
          ls -lh data/all_config_logs.json || true

          echo "Seeded record counts:"
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('data/security_events.json','utf8')); console.log('security_events:', Array.isArray(a) ? a.length : 'not array')"
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('data/all_config_logs.json','utf8')); console.log('all_config_logs:', Array.isArray(a) ? a.length : 'not array')"

      - name: Run ALM configuration logs poller
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        env:
          POLLER_MODE: once
          ALM_USERNAME: ${{ secrets.ALM_USERNAME }}
          ALM_PASSWORD: ${{ secrets.ALM_PASSWORD }}
          ALM_OAUTH_URL: ${{ secrets.ALM_OAUTH_URL }}
          ALM_API_URL: ${{ secrets.ALM_API_URL }}
        run: |
          for attempt in 1 2 3; do
            echo "Running full-log-poller.js attempt $attempt/3"

            if node src/services/full-log-poller.js --once; then
              echo "full-log-poller.js succeeded"
              exit 0
            fi

            echo "full-log-poller.js failed on attempt $attempt"

            if [ "$attempt" -lt 3 ]; then
              echo "Waiting before retry..."
              sleep 30
            fi
          done

          echo "full-log-poller.js failed after 3 attempts"
          exit 1

      - name: Run Risk scoring pipeline synchronously
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        run: |
          echo "Running Risk scoring pipeline synchronously..."

          echo "Step 1 - Normalize logs"
          mlops/venv/bin/python mlops/pipelines/01_normalize_logs.py

          echo "Step 2 - Build ML features"
          mlops/venv/bin/python mlops/pipelines/02_build_features.py

          echo "Step 3 - Train Isolation Forest model"
          mlops/venv/bin/python mlops/training/train_isolation_forest.py

          echo "Step 4 - Verify Isolation Forest model exists"
          if [ ! -f "mlops/models/anomaly/isolation_forest.joblib" ]; then
            echo "ERROR: Missing mlops/models/anomaly/isolation_forest.joblib after training."
            echo "Available model files:"
            find mlops -maxdepth 6 -type f \( -iname "*.joblib" -o -iname "*.pkl" -o -iname "*model*" \) -print -exec ls -lh {} \; || true
            exit 1
          fi

          ls -lh mlops/models/anomaly/isolation_forest.joblib

          echo "Step 5 - Score audit/config events"
          mlops/venv/bin/python mlops/inference/score_event.py

          echo "Risk scoring pipeline completed."

          echo "Searching generated scored/risk files..."
          find . -maxdepth 6 -type f \( -iname "*score*" -o -iname "*scored*" -o -iname "*risk*" \) -print -exec ls -lh {} \; || true

      - name: Run ALM security events poller
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        env:
          POLLER_MODE: once
          ALM_USERNAME: ${{ secrets.ALM_USERNAME }}
          ALM_PASSWORD: ${{ secrets.ALM_PASSWORD }}
          ALM_OAUTH_URL: ${{ secrets.ALM_OAUTH_URL }}
          ALM_API_URL: ${{ secrets.ALM_API_URL }}
        run: |
          for attempt in 1 2 3; do
            echo "Running security-events-poller.js attempt $attempt/3"

            if node src/services/security-events-poller.js --once; then
              echo "security-events-poller.js succeeded"
              exit 0
            fi

            echo "security-events-poller.js failed on attempt $attempt"

            if [ "$attempt" -lt 3 ]; then
              echo "Waiting before retry..."
              sleep 30
            fi
          done

          echo "security-events-poller.js failed after 3 attempts"
          exit 1

      - name: Run Security UEBA pipeline synchronously
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        run: |
          echo "Running Security UEBA pipeline synchronously..."

          mlops/venv/bin/python mlops/security/02_build_security_features.py
          mlops/venv/bin/python mlops/training/security_train.py
          mlops/venv/bin/python mlops/inference/security_score.py

          echo "Security UEBA pipeline completed."

          echo "Searching generated security score files..."
          find . -maxdepth 6 -type f \( -iname "*security*" -o -iname "*ueba*" -o -iname "*score*" \) -print -exec ls -lh {} \; || true

      - name: Check generated log files after pollers and ML pipelines
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        run: |
          echo "Generated files:"
          ls -lh data/all_config_logs.json || true
          ls -lh data/security_events.json || true

          echo "Generated record counts:"
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('data/security_events.json','utf8')); console.log('security_events:', Array.isArray(a) ? a.length : 'not array')"
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('data/all_config_logs.json','utf8')); console.log('all_config_logs:', Array.isArray(a) ? a.length : 'not array')"

          echo "Checking audit scored endpoint source files if present..."
          find . -maxdepth 6 -type f \( -iname "*scored*" -o -iname "*score*" -o -iname "*risk*" \) -print -exec ls -lh {} \; || true

      - name: Build run manifest for versioning
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p artifacts

          ISO_WEEK=$(date -u +%V)
          RUN_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          SECURITY_COUNT=$(node -e "const fs=require('fs'); try { const a=JSON.parse(fs.readFileSync('data/security_events.json','utf8')); process.stdout.write(String(Array.isArray(a)?a.length:0)); } catch(e){ process.stdout.write('0'); }")
          CONFIG_COUNT=$(node -e "const fs=require('fs'); try { const a=JSON.parse(fs.readFileSync('data/all_config_logs.json','utf8')); process.stdout.write(String(Array.isArray(a)?a.length:0)); } catch(e){ process.stdout.write('0'); }")

          cat > artifacts/run-manifest.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "commit_sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "run_date_utc": "${RUN_DATE}",
            "iso_week": "${ISO_WEEK}",
            "record_counts": {
              "security_events": ${SECURITY_COUNT},
              "config_logs": ${CONFIG_COUNT}
            }
          }
          EOF

          echo "Generated manifest:"
          cat artifacts/run-manifest.json

      - name: Create versioned model copies
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p artifacts/models
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)

          if [ -f "mlops/models/anomaly/isolation_forest.joblib" ]; then
            cp mlops/models/anomaly/isolation_forest.joblib \
              "artifacts/models/isolation_forest_run${GITHUB_RUN_NUMBER}_${SHORT_SHA}.joblib"
          fi

          find mlops -type f \( -iname "*.joblib" -o -iname "*.pkl" \) -print || true
          ls -R artifacts/models || true

      - name: Collect pipeline outputs for artifact publishing
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        run: |
          mkdir -p artifacts/data
          mkdir -p artifacts/outputs
          mkdir -p artifacts/deployment

          cp -f data/all_config_logs.json artifacts/data/ 2>/dev/null || true
          cp -f data/security_events.json artifacts/data/ 2>/dev/null || true
          cp -f manifest.yml artifacts/deployment/ 2>/dev/null || true
          cp -f package.json artifacts/deployment/ 2>/dev/null || true
          cp -f package-lock.json artifacts/deployment/ 2>/dev/null || true
          cp -f mlops/requirements.txt artifacts/deployment/ 2>/dev/null || true

          find . -maxdepth 6 -type f \( -iname "*score*" -o -iname "*scored*" -o -iname "*risk*" -o -iname "*ueba*" \) \
            -exec cp --parents {} artifacts/outputs/ \; 2>/dev/null || true

          echo "Artifact contents:"
          find artifacts -type f | sort

      - name: Generate checksums for artifacts
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        run: |
          find artifacts -type f -exec sha256sum {} \; | sort > artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

      - name: Upload versioned ML and data artifacts
        if: always() && steps.biweekly.outputs.run_job == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mlops-artifacts-run-${{ github.run_number }}
          path: monitoring-backend/artifacts
          retention-days: 30
          if-no-files-found: warn

      - name: Install Cloud Foundry CLI
        if: steps.biweekly.outputs.run_job == 'true'
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli
          cf version

      - name: Login to Cloud Foundry
        if: steps.biweekly.outputs.run_job == 'true'
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          cf api "$CF_API"
          cf auth "$CF_USERNAME" "$CF_PASSWORD"
          cf target -o "$CF_ORG" -s "$CF_SPACE"

      - name: Push updated backend with refreshed logs
        if: steps.biweekly.outputs.run_job == 'true'
        working-directory: monitoring-backend
        run: |
          cf push monitoring-backend -f manifest.yml
          cf app monitoring-backend

      - name: Smoke test backend
        if: steps.biweekly.outputs.run_job == 'true'
        run: |
          curl -f "https://monitoring-backend.cfapps.eu10-004.hana.ondemand.com/health" || true

      - name: Smoke test risk scored endpoint
        if: steps.biweekly.outputs.run_job == 'true'
        run: |
          echo "Checking /audit/scored after deployment..."
          curl -f -sS "https://monitoring-backend.cfapps.eu10-004.hana.ondemand.com/audit/scored" \
            -o /tmp/audit-scored.json

          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/audit-scored.json','utf8')); console.log('audit scored logs:', Array.isArray(j.logs) ? j.logs.length : 'not array');"