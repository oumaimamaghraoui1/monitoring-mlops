name: CI - Test and Train ML Baseline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------
      # 1. Checkout repo
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------
      # 2. Setup Node
      # -------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -------------------------------
      # 3. Install backend deps
      # -------------------------------
      - name: Install dependencies
        run: npm install --ignore-scripts

      # -------------------------------
      # 4. Setup Python for ML
      # -------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ML dependencies
        run: pip install -r monitoring-backend/mlops/requirements.txt

      # -------------------------------
      # 5. Lint (optional)
      # -------------------------------
      - name: Lint code
        run: |
          if [ -f "./.eslintrc.json" ]; then
            npm run lint
          else
            echo "No ESLint config found. Skipping lint."
          fi

      # -------------------------------
      # 6. Run unit tests (if exist)
      # -------------------------------
      - name: Run tests
        run: |
          if npm test --silent 2>/dev/null; then
            echo "Tests executed"
          else
            echo "No tests found or test script missing"
          fi

      # -------------------------------
      # 7. npm Security Audit
      # -------------------------------
      - name: Security audit
        run: npm audit --audit-level=high

      # -------------------------------
      # 8. Create ML data folder
      # -------------------------------
      - name: Create ML data folder
        run: mkdir -p monitoring-backend/data

      # -------------------------------
      # 9. Train Behaviour Baseline
      # -------------------------------
      - name: Train Behaviour Baseline
        run: |
          if [ -f "monitoring-backend/src/services/build-baseline.js" ]; then
            node monitoring-backend/src/services/build-baseline.js
          else
            echo "ML baseline script not found."
            exit 1
          fi

      # -------------------------------
      # 10. Validate baseline JSON
      # -------------------------------
      - name: Validate baseline
        run: |
          if [ -f "monitoring-backend/data/behaviour_baseline.json" ]; then
            node monitoring-backend/src/services/validate-baseline.js
          else
            echo "Baseline not generated!"
            exit 1
          fi

      # -------------------------------
      # 11. Test anomaly scoring logic
      # -------------------------------
      - name: Test anomaly scoring
        run: node monitoring-backend/src/services/test-anomaly.js

      # -------------------------------
      # 12. Upload artifact
      # -------------------------------
      - name: Upload trained baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: behaviour-baseline
          path: monitoring-backend/data/behaviour_baseline.json
          if-no-files-found: error
