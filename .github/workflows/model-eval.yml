name: Evaluate RCA Model (CI Synthetic)

on:
  workflow_dispatch:

jobs:
  evaluate-rca-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ML dependencies
        run: pip install -r monitoring-backend/mlops/requirements.txt

      - name: Generate synthetic RCA dataset
        run: python monitoring-backend/mlops/pipelines/generate_rca_ci_data.py

      - name: Train and evaluate RCA model on synthetic dataset
        env:
          RCA_DATA_MODE: synthetic
        run: python monitoring-backend/mlops/training/rca_train.py | tee rca_eval.log

      - name: Upload evaluation log
        uses: actions/upload-artifact@v4
        with:
          name: rca-eval-log
          path: rca_eval.log
          if-no-files-found: error
