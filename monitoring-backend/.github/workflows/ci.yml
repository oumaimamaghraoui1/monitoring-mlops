name: CI - Test and Train ML Baseline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      #
      # 1. Checkout the repo
      #
      - name: Checkout repository
        uses: actions/checkout@v4

      #
      # 2. Setup Node.js (NO secrets needed)
      #
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      #
      # 3. Install dependencies
      #
      - name: Install dependencies
        run: npm install --ignore-scripts

      #
      # 4. Lint (optional)
      #
      - name: Lint code
        run: |
          if [ -f "./.eslintrc.json" ]; then
            npm run lint
          else
            echo "No ESLint config found. Skipping lint."
          fi

      #
      # 5. Run tests (if any exist)
      #
      - name: Run tests
        run: |
          if npm test --silent 2>/dev/null; then
            echo "Tests executed"
          else
            echo "No tests found or test script missing"
          fi

      #
      # 6. Train ML Baseline (NO secrets needed)
      #
      - name: Train Behaviour Baseline
        run: |
          if [ -f "src/services/build-baseline.js" ]; then
            node src/services/build-baseline.js
          else
            echo "ML baseline script not found."
          fi

      #
      # 7. Upload ML model artifact
      #
      - name: Upload trained baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: behaviour-baseline
          path: data/behaviour_baseline.json
          if-no-files-found: ignore