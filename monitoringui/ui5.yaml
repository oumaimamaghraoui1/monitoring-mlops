# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
specVersion: "4.0"
metadata:
  name: pwc.monitoring.monitoringui
type: application

framework:
  name: SAPUI5
  version: "1.144.1"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon

server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300

    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon

    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /backend
            url: https://monitoring-backend.cfapps.eu10-004.hana.ondemand.com
            pathReplace: /
        ui5:
          - path: /resources
            url: https://ui5.sap.com
            version: "1.144.1"
          - path: /test-resources
            url: https://ui5.sap.com
            version: "1.144.1"