<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Basis Monitoring</title>
    
<link rel="icon" type="image/svg+xml" href="img/favicon-sap.svg?v=16">
<link rel="shortcut icon" type="image/svg+xml" href="img/favicon-sap.svg?v=16">

    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.144.1/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "pwc.monitoring.monitoringui": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="pwc.monitoring.monitoringui"
        data-id="container"
        data-settings='{"id" : "pwc.monitoring.monitoringui"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
